services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_inspector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/rag_inspector?schema=public"
      JWT_SECRET: "local-dev-secret-change-in-production-at-least-32-chars"
      PORT: "5000"
      NODE_ENV: development
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
